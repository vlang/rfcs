name: Deploy RFC site

on:
  push:
    branches: [master]
    paths:
      - 'rfcs/**'
      - '*.md'
      - 'site/**'
      - '.github/workflows/deploy-rfc-site.yml'
  pull_request:
    paths:
      - 'rfcs/**'
      - '*.md'
      - 'site/**'
      - '.github/workflows/deploy-rfc-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned V source: release binaries predate veb.render_request,
      # so build the compiler once instead of downloading latest.
      - name: Install V
        run: |
          git init -q /tmp/vsrc
          cd /tmp/vsrc
          git remote add origin https://github.com/vlang/v
          git fetch -q --depth 1 origin 85e48d7a5adb9b5be744bfd32adec67df72b0a1b
          git checkout -q FETCH_HEAD
          make
          ./v version
      - name: Export static site
        run: |
          /tmp/vsrc/v run site --export
          test -f site/dist/index.html
          test -f site/dist/search.json
          ls site/dist/rfc | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
